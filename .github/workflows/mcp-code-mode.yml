name: MCP Code Mode cross-platform contract
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  portable-batch:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4.20,<5'
      - name: Portable batch contract without a JavaScript runtime
        run: python -m unittest discover -s tests -p test_code_mode_batch.py -v
      - name: Install optional Linux sandbox test runtime
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements-code-mode.txt 'pytest>=8,<9'
      - name: Linux JavaScript isolation and resource-limit contracts
        if: runner.os == 'Linux'
        run: python -m pytest tests/test_code_mode.py -q -k 'not flowbench and not openrpa'
